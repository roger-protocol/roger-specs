name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: Test the workflow without release
        default: false
      skip_npm:
        type: boolean
        description: Skip NPM Release
        default: false
      skip_git:
        type: boolean
        description: Skip git (no commits, no tags creation)
        default: false
      skip_github:
        type: boolean
        description: Skip GitHub Release
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Release-It needs to fetch all commits to generate the changelog file with the conventional-changelog plugin

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release Package to the Latest Channel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_DRY_RUN: ${{ inputs.dry_run || false }}
          SKIP_GIT: ${{ inputs.skip_git || false }}
          SKIP_GITHUB: ${{ inputs.skip_github || false }}
          SKIP_NPM: ${{ inputs.skip_npm || false }}
        run: |
          FLAGS=""

          if [ "$IS_DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$SKIP_GIT" = "true" ]; then FLAGS="$FLAGS --no-git"; fi
          if [ "$SKIP_GITHUB" = "true" ]; then FLAGS="$FLAGS --no-github"; fi
          if [ "$SKIP_NPM" = "true" ]; then FLAGS="$FLAGS --no-npm"; fi

          npx release-it --ci $FLAGS

      - name: Deploy Versioned Docs
        if: inputs.dry_run != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
            # Build the docs
            npx cross-env CLOUDFLARE_ACCOUNT_ID= CLOUDFLARE_API_TOKEN= npm run docs:build

            # Create the Cloudflare Project for the specific major version
            MAJOR_VERSION=$(node -p "const v = require('./package.json').version.split('.')[0]; v === '0' ? '1' : v")
            PROJECT_NAME="roger-docs-v${MAJOR_VERSION}"
            DOMAIN="v${MAJOR_VERSION}.rogerprotocol.org"

            echo "Major Version: ${MAJOR_VERSION}"
            echo "Project Name: ${PROJECT_NAME}"
            echo "Domain: ${DOMAIN}"

            npx wrangler pages project create $PROJECT_NAME --production-branch=main || true

            # Bind custom subdomain to the newly created project
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${DOMAIN}\"}"

            # Deploy to the specific major version project
            npx wrangler pages deploy apps/roger-docs/out --project-name=$PROJECT_NAME

            # Deploy to the main project
            npx wrangler pages deploy apps/roger-docs/out --project-name=roger-docs
